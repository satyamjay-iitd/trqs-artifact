[package]
name = "trql-selector"
version = "0.1.0"
edition = "2024"

[features]
default = ["quadratic"]
# Trajectory polynomial degree, forwarded to the poly-aware deps. Exactly one must be enabled.
linear = ["trql-poly/linear", "trql-storage/linear"]
quadratic = ["trql-poly/quadratic", "trql-storage/quadratic"]
cubic = ["trql-poly/cubic", "trql-storage/cubic"]

[dependencies]
smallvec = "1.15.1"
trql-poly = { path = "../trql-poly", default-features = false }
trql-storage = { path = "../trql-storage", default-features = false }
trql-types = { path = "../trql-types" }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["html_reports"] }

[[bench]]
name = "selector"
harness = false
